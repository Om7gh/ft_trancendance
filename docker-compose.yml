services:
  nginx:
    container_name: nginx
    build: ./nginx/
    image: nginx:pingpong
    ports:
      - "8080:80"
    networks:
      - pingpong
    depends_on:
      - rabbitmq
      - chess
      - identity

  rabbitmq:
      container_name: rabbitmq
      image: rabbitmq:3-management
      ports:
        - "15672:15672"
        - "5672:5672"
      networks:
        - pingpong
      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s

  chess:
    container_name: chess
    build: ./services/chess-server/
    image: chess:pingpong
    ports:
      - "9000:9000"
    env_file:
      - ./services/chess-server/.env
    networks:
      - pingpong
    depends_on:
      rabbitmq:
        condition: service_healthy

  identity:
    container_name: identity
    build: ./services/identity-server/
    image: identity:pingpong
    ports:
      - "4000:4000"
    env_file:
      - ./services/identity-server/.env
    networks:
      - pingpong
    depends_on:
      rabbitmq:
        condition: service_healthy
    
  # chat:
  #   container_name: chat
  #   build: ./server/chat-server/
  #   image: chat:pingpong
  #   ports:
  #     - "4000:4000"
  #   env_file:
  #     - ./server/chat-server/.env
  #   networks:
  #     - pingpong
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy

networks:
  pingpong:
    driver: bridge