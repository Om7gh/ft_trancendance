daemon off;

events {
  worker_connections 1024;
}

http {

  include /etc/nginx/mime.types;

  upstream identity_backend {
    server identity:4000;
  }

  upstream chess_backend {
    server chess:9000;
  }

  upstream notification_backend {
    server notification:9005;
  }

  upstream client_frontend {
    server client:3000;
  }

  upstream  pong_backend {
    server  pong:9001;
  }

  upstream chat_backend {
    server chat:9004;
  }

  server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    server_name ${DOMAIN_NAME};

    ssl_protocols TLSv1.3;
		ssl_certificate /run/secrets/ssl-cert;
		ssl_certificate_key /run/secrets/ssl-key;

    location /avatars {
      alias /usr/share/nginx/html/avatars;
      add_header Cache-Control "no-store" always;
    }

    location /api/ {
      proxy_pass http://identity_backend/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    location /fetch {
      proxy_pass http://notification_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

     location /pongGame {
      proxy_pass http://pong_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    location /game/chess {
      proxy_pass http://chess_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 3600;
      proxy_send_timeout 3600;
      proxy_connect_timeout 3600;
    }

    location  /pongGame/ {
      proxy_pass http://pong_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

