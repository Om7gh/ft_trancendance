services:
  nginx:
    container_name: nginx
    build: ./nginx/
    image: nginx:pingpong
    ports:
      - '8080:80'
    networks:
      - pingpong
    depends_on:
      - chess
      - identity
      - client
      - pong
    volumes:
      - $HOME/data/avatars:/usr/share/nginx/html/avatars:ro
    
  chess:
    container_name: chess
    build: ./services/chess-server/
    image: chess:pingpong
    ports:
      - '9000:9000'
    env_file:
      - ./services/chess-server/.env
    networks:
      - pingpong

  identity:
    container_name: identity
    build: ./services/identity-server/
    image: identity:pingpong
    ports:
      - '4000:4000'
    env_file:
      - ./services/identity-server/.env
    volumes:
      - $HOME/data:/var/lib/um
      - $HOME/data/avatars:/var/avatars
    networks:
      - pingpong

  client:
    container_name: client
    build: ./client/
    image: client:pingpong
    ports:
      - '3000:3000'
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
    networks:
      - pingpong
    depends_on:
      - identity
      - chess
      - pong

  pong:
    container_name: pong
    build: ./services/pong-server/
    image: pong:pingpong
    ports:
      - '9001:9001'
    networks:
      - pingpong

  notification:
    container_name: notification
    build: ./services/notification-server/
    image: notification:pingpong
    ports:
      - '9002:9002'
    networks:
      - pingpong

  # chat:
  #   container_name: chat
  #   build: ./server/chat-server/
  #   image: chat:pingpong
  #   ports:
  #     - "4000:4000"
  #   env_file:
  #     - ./server/chat-server/.env
  #   networks:
  #     - pingpong
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy

networks:
  pingpong:
    driver: bridge
