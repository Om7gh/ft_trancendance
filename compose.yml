services:
  nginx:
    container_name: nginx
    build: ./nginx/
    image: nginx:923
    configs:
      - source: nginx-conf
        target: /etc/nginx/nginx.conf
    secrets:
      - ssl-cert
      - ssl-key
    ports:
      - "8080:443"
    networks:
      - agents-923
    depends_on:
      chess:
        condition: service_healthy
      identity:
        condition: service_healthy
      pong:
        condition: service_healthy
      chat:
        condition: service_healthy
      notification:
        condition: service_healthy
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - $HOME/data/avatars:/data/avatars:ro

  chess:
    container_name: chess
    build: ./services/chess-server/
    image: chess:pingpon
    volumes:
      - $HOME/data:/usr/src/app/data
    networks:
      - agents-923
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  identity:
    container_name: identity
    build: ./services/identity-server/
    image: identity:923
    env_file:
      - ./services/identity-server/.env
    volumes:
      - $HOME/data:/var/lib/um
      - $HOME/data/avatars:/var/avatars
    networks:
      - agents-923
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  pong:
    container_name: pong
    build: ./services/pong-server/
    image: pong:923
    networks:
      - agents-923
    volumes:
      - $HOME/data/pong:/var/local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  notification:
    container_name: notification
    build: ./services/notification-server/
    image: notification:923
    networks:
      - agents-923
    volumes:
      - $HOME/data/notification:/var/local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  chat:
    container_name: chat
    build: ./services/chat-server/
    image: chat:923
    env_file: services/chat-server/.env
    networks:
      - agents-923
    volumes:
      - $HOME/data/chat:/var/lib/sqlite/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  agents-923:
    driver: bridge

volumes:
  chess-data:

configs:
  nginx-conf:
    file: ./nginx/conf/nginx.conf

secrets:
  ssl-cert:
    file: $HOME/data/ssl-cert.pem
  ssl-key:
    file: $HOME/data/ssl-key.pem
